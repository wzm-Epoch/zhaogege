name: 文档与提交检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: 文档与提交检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 检查文档与提交规范
        run: python3 -B scripts/check_repository.py
      - name: 验证检查器
        run: python3 -B -m unittest discover -s tests -v
